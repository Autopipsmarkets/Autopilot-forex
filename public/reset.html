<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password | Autopilot Forex</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<header><div class="container"><nav>
<a href="/" class="brand"><img src="/logo.png" alt=""><span>AUTOPILOT</span> FOREX</a>
<a class="btn" href="/">Back to site</a>
</nav></div></header>

<main class="container" style="max-width:520px;padding:60px 0">
<div class="dashboard">
<h2>Choose a new password</h2>
<p class="muted small" style="margin-top:8px">This link works once and expires 30 minutes after it was sent.</p>

<form id="resetForm" style="margin-top:20px">
<div class="field"><label for="password">New password</label><input id="password" type="password" minlength="10" autocomplete="new-password" required>
<span class="small muted">At least 10 characters, mixing letters with numbers or symbols.</span></div>
<button class="btn primary" type="submit" id="resetBtn">Save password</button>
</form>
<p id="resetMessage" class="small" style="margin-top:14px"></p>
</div>
</main>

<script src="/assets/reset.js" defer></script>
</body>
</html>
