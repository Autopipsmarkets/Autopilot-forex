<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autopilot Forex · Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div id="loginScreen" class="login-wrap" hidden>
  <div class="login-card">
    <h1>Team sign-in</h1>
    <p>Autopilot Forex operations console.</p>
    <form id="loginForm">
      <div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="field"><label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" type="submit" style="width:100%" id="loginBtn">Sign in</button>
      <p class="msg" id="loginMsg"></p>
    </form>
  </div>
</div>

<div id="app" class="layout" hidden>
  <aside>
    <div class="brand"><img src="/logo.png" alt=""><div>AUTOPILOT <span>ADMIN</span></div></div>
    <button class="nav-item" data-view="overview">Overview</button>
    <button class="nav-item" data-view="users">Users</button>
    <button class="nav-item" data-view="signals">Signals</button>
    <button class="nav-item" data-view="posts">Research</button>
    <button class="nav-item" data-view="plans">Plans</button>
    <button class="nav-item" data-view="subscriptions">Subscriptions</button>
    <button class="nav-item" data-view="payments">Payments</button>
    <button class="nav-item" data-view="messages">Messages</button>
    <button class="nav-item" data-view="audit">Audit log</button>
    <button class="nav-item" data-view="settings">Settings</button>
    <div class="sidebar-foot">
      <div id="whoami" class="mono"></div>
      <button class="btn ghost sm" id="logoutBtn" style="margin-top:8px">Sign out</button>
      <a class="btn ghost sm" href="/" style="display:inline-block;margin-top:6px">View site</a>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <h1 id="viewTitle">Overview</h1>
      <div id="viewActions"></div>
    </div>
    <div id="viewRoot"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">Edit</h2>
    <form id="sheetForm"><div id="sheetFields"></div>
      <div class="sheet-actions">
        <button type="button" class="btn ghost" id="sheetCancel">Cancel</button>
        <button type="submit" class="btn primary" id="sheetSave">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/admin/admin.js" defer></script>
</body>
</html>
